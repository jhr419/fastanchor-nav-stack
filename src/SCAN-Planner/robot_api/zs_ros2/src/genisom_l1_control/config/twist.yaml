genisom_twist_control:
  ros__parameters:
    robot_ip: "192.168.168.168"
    # 需与机器人端 /opt/export/config/sdk_config.yaml 的 target_ip/target_port 保持一致。
    local_ip: "192.168.168.99"
    local_port: 43988

    cmd_vel_topic: "/cmd_vel"
    connection_timeout_ms: 10000
    mode_command_timeout_ms: 8000
    command_retry_ms: 500
    status_rate_hz: 5.0

    # 启动后自动调用旧版 HighLevel::standUp，随后直接接收 /cmd_vel。
    auto_stand: true

    # 直接把 ROS cmd_vel 作为 HighLevel::move(vx, vy, yaw_rate) 的物理速度。
    limit_cmd_vel_input: false
    max_linear_x: 3.7
    max_linear_y: 1.0
    max_angular_z: 3.0
    linear_deadband: 0.0
    angular_deadband: 0.0
