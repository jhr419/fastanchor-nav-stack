yifan_lio_adapter_node:
  ros__parameters:
    # yifanLIO root config file, resolved against the lio package yaml directory
    # (or lio_yaml_dir if provided). The adapter reads the SAME file as the LIO
    # node so the extrinsic and topic names have a single source of truth.
    lio_root_config: "root_localization.yaml"

    # FAST-LIO-compatible unified interface consumed by FastAnchor ICP.
    output_odom_topic: "/Odometry"
    output_cloud_topic: "/cloud_registered_body"

    # Frame normalization to FAST-LIO semantics.
    world_frame: "camera_init"
    body_frame: "body"

    # Coordinate rotation from yifanLIO's physical IMU frame into the virtual
    # body frame used by the working FastLIO2 baseline. This must match
    # FAST_LIO preprocess.input_rotation_rpy_rad and is applied to BOTH the
    # cloud coordinates and the odometry child-frame pose.
    imu_to_common_body_rpy: [-0.034101, 0.566395, 0.0]

    # High-rate IMU prediction odometry remains available on /Odometry. A cloud
    # is exposed only after its exact-stamp posterior odom has arrived, while
    # FastAnchor selects that pose from its common timestamp buffer for ICP.
    max_sync_queue_size: 2000

    # Mirror FAST-LIO's camera_init -> body TF.
    publish_tf: true
